<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" font-family="Helvetica,Arial,sans-serif" width="1280" height="880">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#805ad5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="880" fill="#ffffff"/>
  <text x="640" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a202c">Skematik Alat — SISTOMATE (Mini Greenhouse)</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#4a5568">Wiring ESP32 · 3 sensor · 2 modul relay 2-ch aktif-LOW · beban (2 pompa + kipas) · adaptor 5V · common ground</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(40,74)">
    <rect x="0" y="0" width="360" height="118" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="12" y="20" font-size="13" font-weight="bold" fill="#2d3748">Legenda</text>
    <line x1="12" y1="36" x2="52" y2="36" stroke="#2b6cb0" stroke-width="3"/>
    <text x="60" y="40" font-size="12" fill="#2d3748">Sinyal GPIO (3.3V logic)</text>
    <line x1="12" y1="58" x2="52" y2="58" stroke="#805ad5" stroke-width="3"/>
    <text x="60" y="62" font-size="12" fill="#2d3748">I2C (SDA / SCL)</text>
    <line x1="12" y1="80" x2="52" y2="80" stroke="#e53e3e" stroke-width="3"/>
    <text x="60" y="84" font-size="12" fill="#2d3748">+5V (adaptor eksternal)</text>
    <line x1="12" y1="102" x2="52" y2="102" stroke="#1a202c" stroke-width="3"/>
    <text x="60" y="106" font-size="12" fill="#2d3748">GND — common ground (rail bawah)</text>
  </g>

  <!-- ============ SENSORS ============ -->
  <!-- Soil moisture -->
  <g>
    <rect x="40" y="250" width="170" height="80" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="125" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4396">Soil Moisture</text>
    <text x="125" y="300" text-anchor="middle" font-size="11" fill="#2d3748">(analog probe)</text>
    <text x="125" y="320" text-anchor="middle" font-size="11" fill="#2d3748">kering=4095 · basah=1500</text>
    <circle cx="210" cy="285" r="4" fill="#2b6cb0"/>
  </g>
  <!-- DHT11 -->
  <g>
    <rect x="40" y="400" width="170" height="80" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="125" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4396">DHT11</text>
    <text x="125" y="450" text-anchor="middle" font-size="11" fill="#2d3748">Suhu + Kelembapan</text>
    <text x="125" y="470" text-anchor="middle" font-size="11" fill="#2d3748">(digital 1-wire)</text>
    <circle cx="210" cy="440" r="4" fill="#2b6cb0"/>
  </g>
  <!-- TCS34725 -->
  <g>
    <rect x="40" y="550" width="170" height="90" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="125" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4396">TCS34725</text>
    <text x="125" y="600" text-anchor="middle" font-size="11" fill="#2d3748">Sensor warna RGB daun</text>
    <text x="125" y="620" text-anchor="middle" font-size="11" fill="#2d3748">(I2C)</text>
    <circle cx="210" cy="578" r="4" fill="#805ad5"/>
    <circle cx="210" cy="612" r="4" fill="#805ad5"/>
  </g>

  <!-- ============ ESP32 ============ -->
  <g>
    <rect x="440" y="250" width="220" height="430" rx="10" fill="#e6fffa" stroke="#2c7a7b" stroke-width="3"/>
    <text x="550" y="285" text-anchor="middle" font-size="18" font-weight="bold" fill="#234e52">ESP32 Dev Board</text>
    <text x="550" y="308" text-anchor="middle" font-size="11" fill="#2d3748">SISTOMATE.ino (firmware)</text>
    <line x1="455" y1="320" x2="645" y2="320" stroke="#2c7a7b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="470" y="338" font-size="10" font-weight="bold" fill="#2c7a7b">PIN KIRI</text>
    <text x="640" y="338" font-size="10" font-weight="bold" fill="#2c7a7b" text-anchor="end">PIN KANAN</text>

    <!-- left pins -->
    <g font-size="17" fill="#1a202c">
      <text x="452" y="376" text-anchor="start">3V3</text>
      <text x="452" y="416" text-anchor="start">GPIO34</text>
      <text x="452" y="470" text-anchor="start">GPIO13</text>
      <text x="452" y="570" text-anchor="start">GPIO21</text>
      <text x="452" y="605" text-anchor="start">GPIO22</text>
      <text x="452" y="655" text-anchor="start">GND</text>
    </g>
    <!-- right pins -->
    <g font-size="17" fill="#1a202c">
      <text x="648" y="416" text-anchor="end">GPIO26</text>
      <text x="648" y="456" text-anchor="end">GPIO14</text>
      <text x="648" y="570" text-anchor="end">GPIO27</text>
      <text x="648" y="610" text-anchor="end">GPIO25*</text>
      <text x="648" y="655" text-anchor="end">GND</text>
    </g>
    <!-- left pin dots -->
    <circle cx="440" cy="372" r="4" fill="#e53e3e"/><circle cx="440" cy="412" r="4" fill="#2b6cb0"/>
    <circle cx="440" cy="466" r="4" fill="#2b6cb0"/><circle cx="440" cy="566" r="4" fill="#805ad5"/>
    <circle cx="440" cy="601" r="4" fill="#805ad5"/><circle cx="440" cy="651" r="4" fill="#1a202c"/>
    <!-- right pin dots -->
    <circle cx="660" cy="412" r="4" fill="#2b6cb0"/><circle cx="660" cy="452" r="4" fill="#2b6cb0"/>
    <circle cx="660" cy="566" r="4" fill="#2b6cb0"/><circle cx="660" cy="606" r="4" fill="#2b6cb0" stroke="#a0aec0" stroke-dasharray="2 2"/>
    <circle cx="660" cy="651" r="4" fill="#1a202c"/>
  </g>

  <!-- ============ RELAY A ============ -->
  <g>
    <rect x="770" y="250" width="210" height="170" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
    <text x="875" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#742a2a">Modul Relay A</text>
    <text x="875" y="294" text-anchor="middle" font-size="11" fill="#2d3748">2-ch · aktif-LOW</text>
    <g font-size="17" fill="#1a202c">
      <text x="782" y="325">IN1 GPIO26</text>
      <text x="782" y="355">IN2 GPIO14</text>
      <text x="782" y="392">VCC GND</text>
      <text x="968" y="325" text-anchor="end">NO1</text>
      <text x="968" y="355" text-anchor="end">NO2</text>
      <text x="968" y="392" text-anchor="end">COM</text>
    </g>
    <circle cx="770" cy="321" r="4" fill="#2b6cb0"/><circle cx="770" cy="351" r="4" fill="#2b6cb0"/>
    <circle cx="770" cy="388" r="4" fill="#e53e3e"/>
    <circle cx="980" cy="321" r="4" fill="#dd6b20"/><circle cx="980" cy="351" r="4" fill="#dd6b20"/>
    <circle cx="980" cy="388" r="4" fill="#e53e3e"/>
  </g>

  <!-- ============ RELAY B ============ -->
  <g>
    <rect x="770" y="500" width="210" height="170" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
    <text x="875" y="526" text-anchor="middle" font-size="16" font-weight="bold" fill="#742a2a">Modul Relay B</text>
    <text x="875" y="544" text-anchor="middle" font-size="11" fill="#2d3748">2-ch · aktif-LOW</text>
    <g font-size="17" fill="#1a202c">
      <text x="782" y="575">IN1 GPIO27</text>
      <text x="782" y="605">IN2 spare*</text>
      <text x="782" y="642">VCC GND</text>
      <text x="968" y="575" text-anchor="end">NO1</text>
      <text x="968" y="642" text-anchor="end">COM</text>
    </g>
    <circle cx="770" cy="571" r="4" fill="#2b6cb0"/><circle cx="770" cy="601" r="4" fill="#2b6cb0" stroke="#a0aec0" stroke-dasharray="2 2"/>
    <circle cx="770" cy="638" r="4" fill="#e53e3e"/>
    <circle cx="980" cy="571" r="4" fill="#dd6b20"/>
    <circle cx="980" cy="638" r="4" fill="#e53e3e"/>
  </g>

  <!-- ============ LOADS ============ -->
  <g>
    <rect x="1070" y="255" width="175" height="70" rx="8" fill="#fffff0" stroke="#b7791f" stroke-width="2"/>
    <text x="1157" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#744210">Pompa Air</text>
    <text x="1157" y="305" text-anchor="middle" font-size="11" fill="#2d3748">submersible 5V</text>
    <circle cx="1070" cy="290" r="4" fill="#dd6b20"/><circle cx="1157" cy="325" r="4" fill="#1a202c"/>
  </g>
  <g>
    <rect x="1070" y="360" width="175" height="70" rx="8" fill="#fffff0" stroke="#b7791f" stroke-width="2"/>
    <text x="1157" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#744210">Pompa Pupuk</text>
    <text x="1157" y="410" text-anchor="middle" font-size="11" fill="#2d3748">submersible 5V (fertigasi)</text>
    <circle cx="1070" cy="395" r="4" fill="#dd6b20"/><circle cx="1157" cy="430" r="4" fill="#1a202c"/>
  </g>
  <g>
    <rect x="1070" y="505" width="175" height="70" rx="8" fill="#fffff0" stroke="#b7791f" stroke-width="2"/>
    <text x="1157" y="533" text-anchor="middle" font-size="13" font-weight="bold" fill="#744210">Kipas Exhaust</text>
    <text x="1157" y="555" text-anchor="middle" font-size="11" fill="#2d3748">80mm (5V/12V sesuai spek)</text>
    <circle cx="1070" cy="540" r="4" fill="#dd6b20"/><circle cx="1157" cy="575" r="4" fill="#1a202c"/>
  </g>

  <!-- ============ ADAPTOR ============ -->
  <g>
    <rect x="770" y="720" width="220" height="80" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
    <text x="880" y="750" text-anchor="middle" font-size="17" font-weight="bold" fill="#553c9a">Adaptor 5V (eksternal)</text>
    <text x="880" y="772" text-anchor="middle" font-size="11" fill="#2d3748">catu beban: pompa &amp; kipas</text>
    <text x="880" y="790" text-anchor="middle" font-size="11" fill="#a0aec0">JANGAN dari pin 5V ESP32</text>
    <circle cx="770" cy="755" r="5" fill="#e53e3e"/>
    <circle cx="880" cy="800" r="5" fill="#1a202c"/>
  </g>

  <!-- ============ COMMON GND RAIL ============ -->
  <line x1="70" y1="850" x2="1245" y2="850" stroke="#1a202c" stroke-width="5"/>
  <text x="640" y="872" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">COMMON GROUND (GND rail) — GND ESP32 = GND Adaptor = GND Relay = GND beban</text>

  <!-- ======= SENSOR SIGNAL WIRES (blue) ======= -->
  <polyline points="210,285 330,285 330,412 440,412" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <polyline points="210,440 360,440 360,466 440,466" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <!-- I2C (purple) -->
  <polyline points="210,578 300,578 300,566 440,566" fill="none" stroke="#805ad5" stroke-width="2.5" marker-end="url(#arP)"/>
  <polyline points="210,612 340,612 340,601 440,601" fill="none" stroke="#805ad5" stroke-width="2.5" marker-end="url(#arP)"/>
  <!-- +3V3 to sensors -->
  <polyline points="440,372 400,372 400,230 40,230 40,250" fill="none" stroke="#e53e3e" stroke-width="2" stroke-dasharray="6 3"/>
  <polyline points="40,230 40,400" fill="none" stroke="#e53e3e" stroke-width="2" stroke-dasharray="6 3"/>
  <polyline points="40,230 40,550" fill="none" stroke="#e53e3e" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="46" y="224" font-size="10" fill="#e53e3e">+3V3</text>

  <!-- ======= ESP32 -> RELAY CONTROL (blue) ======= -->
  <polyline points="660,412 715,412 715,321 770,321" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#ar)"/>
  <polyline points="660,452 735,452 735,351 770,351" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#ar)"/>
  <polyline points="660,566 715,566 715,571 770,571" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#ar)"/>
  <polyline points="660,606 755,606 755,601 770,601" fill="none" stroke="#a0aec0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <!-- ======= RELAY NO -> LOADS (orange = beban +) ======= -->
  <polyline points="980,321 1025,321 1025,290 1070,290" fill="none" stroke="#dd6b20" stroke-width="2.5"/>
  <polyline points="980,351 1035,351 1035,395 1070,395" fill="none" stroke="#dd6b20" stroke-width="2.5"/>
  <polyline points="980,571 1025,571 1025,540 1070,540" fill="none" stroke="#dd6b20" stroke-width="2.5"/>

  <!-- ======= +5V distribution (red) ======= -->
  <!-- adaptor +5V -> relay A VCC, relay B VCC (left channel x=740) -->
  <polyline points="770,755 745,755 745,388 770,388" fill="none" stroke="#e53e3e" stroke-width="3"/>
  <polyline points="745,638 770,638" fill="none" stroke="#e53e3e" stroke-width="3"/>
  <circle cx="745" cy="638" r="4" fill="#e53e3e"/>
  <text x="700" y="470" font-size="11" fill="#c53030" transform="rotate(-90 700 470)">+5V</text>
  <!-- adaptor +5V -> relay COM (right channel x=1045) -->
  <polyline points="990,755 1045,755 1045,388 980,388" fill="none" stroke="#e53e3e" stroke-width="3"/>
  <polyline points="1045,638 980,638" fill="none" stroke="#e53e3e" stroke-width="3"/>
  <circle cx="1045" cy="638" r="4" fill="#e53e3e"/>
  <text x="1055" y="500" font-size="11" fill="#c53030">+5V</text>

  <!-- ======= GND connections (black) ======= -->
  <!-- sensors GND via left bus x=70 -->
  <polyline points="40,310 70,310" fill="none" stroke="#1a202c" stroke-width="2"/>
  <polyline points="40,460 70,460" fill="none" stroke="#1a202c" stroke-width="2"/>
  <polyline points="40,620 70,620" fill="none" stroke="#1a202c" stroke-width="2"/>
  <line x1="70" y1="310" x2="70" y2="850" stroke="#1a202c" stroke-width="2.5"/>
  <!-- ESP32 GND left -> rail -->
  <polyline points="440,651 400,651 400,850" fill="none" stroke="#1a202c" stroke-width="3"/>
  <!-- relay GNDs -> rail (x=755) -->
  <line x1="755" y1="388" x2="755" y2="850" stroke="#1a202c" stroke-width="2.5"/>
  <polyline points="770,638 755,638" fill="none" stroke="#1a202c" stroke-width="2.5"/>
  <circle cx="755" cy="638" r="4" fill="#1a202c"/>
  <!-- adaptor GND -> rail -->
  <line x1="880" y1="800" x2="880" y2="850" stroke="#1a202c" stroke-width="3"/>
  <!-- loads GND -> rail (x=1230) -->
  <polyline points="1157,325 1230,325" fill="none" stroke="#1a202c" stroke-width="2.5"/>
  <polyline points="1157,430 1230,430" fill="none" stroke="#1a202c" stroke-width="2.5"/>
  <polyline points="1157,575 1230,575" fill="none" stroke="#1a202c" stroke-width="2.5"/>
  <line x1="1230" y1="325" x2="1230" y2="850" stroke="#1a202c" stroke-width="2.5"/>

  <!-- ======= KEY CALLOUT: common ground ======= -->
  <g transform="translate(40,690)">
    <rect x="0" y="0" width="330" height="150" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
    <text x="15" y="24" font-size="13" font-weight="bold" fill="#744210">★ Penting (lihat prototype-plan)</text>
    <text x="15" y="50" font-size="12" fill="#2d3748">1. Common ground WAJIB: GND ESP32</text>
    <text x="15" y="68" font-size="12" fill="#2d3748">   nyambung ke GND adaptor 5V eksternal.</text>
    <text x="15" y="94" font-size="12" fill="#2d3748">2. Pompa/kipas dari adaptor, BUKAN pin</text>
    <text x="15" y="112" font-size="12" fill="#2d3748">   5V ESP32 (arus beban &gt; supply → hang).</text>
    <text x="15" y="138" font-size="12" fill="#2d3748">3. Relay aktif-LOW: IN=LOW → kontak tertutup.</text>
  </g>
  <text x="640" y="676" text-anchor="middle" font-size="11" fill="#a0aec0" font-style="italic">* GPIO25 = kanal cadangan Relay B (belum dipakai firmware)</text>
</svg>
