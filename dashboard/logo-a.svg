<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo SISTOMATE Opsi A - The Botanical Crest">
  <title>SISTOMATE - The Botanical Crest</title>
  <!-- siluet buah tomat: solid mass dengan lekukan bahu lembut -->
  <path d="M32 25.5c9.8 0 17.8 6.7 17.8 16 0 6.2-3.2 11.7-8.2 14.9-2.9 1.8-6.1 2.8-9.6 2.8-3.5 0-6.7-1-9.6-2.8-5-3.2-8.2-8.7-8.2-14.9 0-9.3 8-16 17.8-16z" fill="#167D47"/>
  <!-- kilau lembut sisi kiri: kedalaman tanpa gradasi -->
  <path d="M18.6 43.5c-.8-6.7 1.6-13 6.6-17.4-3.3 4.3-4.7 9.5-3.9 14.6.6 4.1 2.5 7.8 5.3 10.5-3.5-1.4-6.5-3.9-8-7.7z" fill="#22A55F" opacity=".55"/>
  <!-- mahkota kaliks: 5 daun mekar berbobot + outline hijau tua (terbaca di latar apa pun) -->
  <g fill="#E8F4EC" stroke="#0E4E2C" stroke-width="1.5" stroke-linejoin="round">
    <path d="M32 21.6C28.4 18.2 27.9 12 32 7 36.1 12 35.6 18.2 32 21.6Z"/>
    <path d="M32 21.6C28.4 18.2 27.9 12 32 7 36.1 12 35.6 18.2 32 21.6Z" transform="rotate(72 32 19.5)"/>
    <path d="M32 21.6C28.4 18.2 27.9 12 32 7 36.1 12 35.6 18.2 32 21.6Z" transform="rotate(-72 32 19.5)"/>
    <path d="M32 21.6C28.4 18.2 27.9 12 32 7 36.1 12 35.6 18.2 32 21.6Z" transform="rotate(144 32 19.5)"/>
    <path d="M32 21.6C28.4 18.2 27.9 12 32 7 36.1 12 35.6 18.2 32 21.6Z" transform="rotate(-144 32 19.5)"/>
  </g>
  <!-- batang tangkai: pendek & tebal, keluar dari pusat kaliks -->
  <path d="M29.7 20.4L30.3 9.6Q32 8.2 33.7 9.8L34.3 20.5Z" fill="#0E4E2C"/>
  <!-- nodus sensor IoT di pangkal batang / pusat kaliks -->
  <circle cx="32" cy="19.5" r="2.2" fill="#16241B"/>
</svg>
